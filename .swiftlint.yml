# SwiftLint Configuration
# Prajakta Kulkarni Portfolio App
# See CODING_CONVENTIONS.md for full naming and style rules

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - empty_string

included:
  - PrajaktaKulkarniPortfolio

excluded:
  - PrajaktaKulkarniPortfolio/PrajaktaKulkarniPortfolio/Resources
  - Pods
  - .build

# Line length
line_length:
  warning: 150
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

# Function body length
function_body_length:
  warning: 300
  error: 500

# Function parameter count
function_parameter_count:
  warning: 6
  error: 8

# Type body length
type_body_length:
  warning: 300
  error: 500

# File length
file_length:
  warning: 1000
  error: 1500
  ignore_comment_only_lines: true

# Cyclomatic complexity
cyclomatic_complexity:
  warning: 15
  error: 25

# Identifier naming — enforces descriptive names per coding conventions
identifier_name:
  min_length:
    warning: 3
    error: 2
  excluded:
    - id
    - url
    - URL
